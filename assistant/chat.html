<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUTech Transport – مساعد المواصلات</title>
<style>
  :root {
    --bg: #f6f3f8;
    --surface: #ffffff;
    --text: #241b2a;
    --muted: #6b6275;
    --primary: #5b2a82;
    --on-primary: #ffffff;
    --accent: #2a7a8a;
    --border: #e4dcea;
    --chip: #efe8f5;
    --error: #b3261e;
    --shadow: 0 1px 2px rgba(36, 27, 42, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151019;
      --surface: #211a27;
      --text: #f0eaf4;
      --muted: #a79bb1;
      --primary: #b58be0;
      --on-primary: #1a0f24;
      --accent: #6cc3d3;
      --border: #38303f;
      --chip: #2c2336;
      --error: #f2a29b;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.6 "Segoe UI", Tahoma, system-ui, -apple-system, "Noto Sans Arabic", sans-serif;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 760px;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo {
    width: 40px; height: 40px; border-radius: 12px;
    background: var(--primary); color: var(--on-primary);
    display: grid; place-items: center; font-weight: 700; font-size: 15px; flex: none;
  }
  header h1 { font-size: 17px; margin: 0; line-height: 1.3; }
  header p { margin: 0; font-size: 13px; color: var(--muted); }
  .badge {
    margin-inline-start: auto;
    font-size: 12px; color: var(--accent);
    border: 1px solid var(--accent); border-radius: 999px; padding: 2px 10px; flex: none;
  }
  #log {
    flex: 1; overflow-y: auto; padding: 18px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .msg { max-width: 86%; display: flex; }
  .msg.user { align-self: flex-start; }   /* RTL page: start = right side */
  .msg.bot { align-self: flex-end; }
  .bubble {
    padding: 10px 14px; border-radius: 16px;
    white-space: pre-wrap; overflow-wrap: anywhere;
    unicode-bidi: plaintext;
  }
  .user .bubble { background: var(--primary); color: var(--on-primary); border-end-start-radius: 4px; }
  .bot .bubble { background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); border-end-end-radius: 4px; }
  .bot.error .bubble { color: var(--error); border-color: var(--error); }
  .typing .bubble { display: flex; gap: 5px; padding: 14px 16px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite ease-in-out; }
  .dot:nth-child(2) { animation-delay: .2s; }
  .dot:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; opacity: .6; } }
  #chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 18px 12px; }
  #chips[hidden] { display: none; }
  #chips button {
    background: var(--chip); color: var(--text); border: 1px solid var(--border);
    border-radius: 999px; padding: 7px 14px; font: inherit; font-size: 14px; cursor: pointer;
  }
  #chips button:hover { border-color: var(--primary); }
  form {
    display: flex; gap: 10px; align-items: flex-end;
    padding: 12px 18px calc(12px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--border); background: var(--surface);
  }
  textarea {
    flex: 1; resize: none; max-height: 140px; min-height: 44px;
    padding: 10px 14px; font: inherit; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 14px;
  }
  textarea::placeholder { color: var(--muted); }
  button[type="submit"] {
    height: 44px; padding: 0 20px; border: 0; border-radius: 14px; cursor: pointer;
    background: var(--primary); color: var(--on-primary); font: inherit; font-weight: 600;
  }
  button[type="submit"]:disabled { opacity: .5; cursor: not-allowed; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .note { text-align: center; font-size: 12px; color: var(--muted); padding: 0 18px 10px; background: var(--surface); }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo" aria-hidden="true">SUT</div>
    <div>
      <h1 dir="auto">مساعد مواصلات جامعة السويدي</h1>
      <p dir="auto">اسأل عن المواعيد والاشتراك والاسترداد وقواعد الباص</p>
    </div>
    <span class="badge">تجريبي</span>
  </header>

  <main id="log" aria-live="polite"></main>

  <div id="chips"></div>

  <form id="form" autocomplete="off">
    <textarea id="input" rows="1" dir="auto" placeholder="اكتب سؤالك هنا…" aria-label="سؤالك"></textarea>
    <button type="submit" id="send">إرسال</button>
  </form>
  <div class="note" dir="auto">الردود من مستندات الجامعة الرسمية. للتأكيد كلّم مكتب النقل: transportation@sut.edu.eg</div>
</div>

<script>
  const log = document.getElementById('log');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const chips = document.getElementById('chips');

  const SUGGESTIONS = [
    'الباص بيوصل الجامعة الساعة كام؟',
    'ازاي أدفع بالفيزا؟',
    'ينفع أسترد فلوسي دلوقتي؟',
    'ممنوع إيه جوه الباص؟',
    'How do I subscribe?',
    'Can I smoke on the bus?'
  ];

  function addMsg(text, who, extraClass) {
    const row = document.createElement('div');
    row.className = 'msg ' + who + (extraClass ? ' ' + extraClass : '');
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.setAttribute('dir', 'auto');
    bubble.textContent = text;           // textContent: never inject model output as HTML
    row.appendChild(bubble);
    log.appendChild(row);
    log.scrollTop = log.scrollHeight;
    return row;
  }

  function addTyping() {
    const row = document.createElement('div');
    row.className = 'msg bot typing';
    row.innerHTML = '<div class="bubble" aria-label="جاري الكتابة"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
    log.appendChild(row);
    log.scrollTop = log.scrollHeight;
    return row;
  }

  async function ask(question) {
    chips.hidden = true;
    addMsg(question, 'user');
    sendBtn.disabled = true;
    const typing = addTyping();
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 60000);
    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question }),
        signal: controller.signal
      });
      const data = await res.json();
      typing.remove();
      if (data.status === 'success') addMsg(data.response, 'bot');
      else addMsg(data.response || 'حصلت مشكلة، حاول تاني.', 'bot', 'error');
    } catch (e) {
      typing.remove();
      addMsg('مش قادر أوصل للسيرفر. اتأكد إنه شغال وحاول تاني.', 'bot', 'error');
    } finally {
      clearTimeout(timer);
      sendBtn.disabled = false;
      input.focus();
    }
  }

  function grow() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const q = input.value.trim();
    if (!q || sendBtn.disabled) return;
    input.value = '';
    grow();
    ask(q);
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      form.requestSubmit();
    }
  });
  input.addEventListener('input', grow);

  SUGGESTIONS.forEach((s) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = s;
    b.setAttribute('dir', 'auto');
    b.addEventListener('click', () => ask(s));
    chips.appendChild(b);
  });

  addMsg('أهلاً بك! أنا مساعد مواصلات جامعة السويدي. اسألني عن المواعيد أو الاشتراك أو الاسترداد أو قواعد الباص.\nHi! Ask me about schedules, subscription, refunds or bus rules.', 'bot');
</script>
</body>
</html>
