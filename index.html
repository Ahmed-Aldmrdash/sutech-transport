<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SUtech Transport Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout: top role switcher; phone stage + presenter notes for student/driver; sidebar dashboard for admin */
:root{
  --bg:#F7F7F7; --surface:#FFFFFF; --surface-2:#F9F9F9; --ink:#1F1A24; --muted:#6D6E6F; --line:#E7E7E7;
  --brand:#58286E; --brand-2:#2F103D; --brand-soft:#F3EEF6; --on-brand:#FFFFFF;
  --sun:#B4472E; --sun-soft:#FDF0EC; --on-sun:#FFFFFF;
  --teal:#257988; --teal-soft:#E9F3F5; --coral:#CF644B;
  --ok:#176B41; --ok-soft:#DDF1E5; --warn:#855108; --warn-soft:#FBECD3; --bad:#C62828; --bad-soft:#F9E0E0;
  --water:#BFDDE2; --land:#EEF1EC; --road:#FFFFFF; --block:#E2E5DE;
  --shadow:0 4px 20px rgba(0,0,0,.1);
  --f-display:"Montserrat","Tajawal",system-ui,sans-serif;
  --f-body:"Tajawal","Montserrat",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16101A; --surface:#211A26; --surface-2:#2A2230; --ink:#F3F1F5; --muted:#A7A3AD; --line:#362E3C;
  --brand:#A583B6; --brand-2:#BFA1CE; --brand-soft:#33243D; --on-brand:#16101A;
  --sun:#F1AE9F; --sun-soft:#3A221C; --on-sun:#16101A;
  --teal:#7AB8C0; --teal-soft:#173339; --coral:#E69583;
  --ok:#4CC08A; --ok-soft:#173826; --warn:#E3A848; --warn-soft:#3A2C12; --bad:#EF7A6E; --bad-soft:#3D1F1C;
  --water:#1E3940; --land:#1C1820; --road:#2E2734; --block:#241E29;
  --shadow:0 4px 20px rgba(0,0,0,.40); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16101A; --surface:#211A26; --surface-2:#2A2230; --ink:#F3F1F5; --muted:#A7A3AD; --line:#362E3C;
  --brand:#A583B6; --brand-2:#BFA1CE; --brand-soft:#33243D; --on-brand:#16101A;
  --sun:#F1AE9F; --sun-soft:#3A221C; --on-sun:#16101A;
  --teal:#7AB8C0; --teal-soft:#173339; --coral:#E69583;
  --ok:#4CC08A; --ok-soft:#173826; --warn:#E3A848; --warn-soft:#3A2C12; --bad:#EF7A6E; --bad-soft:#3D1F1C;
  --water:#1E3940; --land:#1C1820; --road:#2E2734; --block:#241E29;
  --shadow:0 4px 20px rgba(0,0,0,.40); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
#app{min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
[lang="en"]{--f-body:"Montserrat","Tajawal",system-ui,sans-serif}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:800;margin:0;text-wrap:balance;line-height:1.3}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:17px}
.brand-mark{width:34px;height:34px;border-radius:8px;background:var(--brand);display:grid;place-items:center}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted)}
.roles{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px;margin-inline-start:auto;flex-wrap:wrap}
.roles button{border:0;background:transparent;padding:7px 16px;border-radius:999px;font-weight:600;color:var(--muted)}
.roles button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.theme-btn{display:grid;place-items:center;padding:7px 10px}
.reset{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:13px;color:var(--muted)}
.mock-tag{font-size:12px;background:var(--sun-soft);color:var(--sun);padding:3px 10px;border-radius:999px;font-weight:600}

/* stage */
.stage{display:grid;grid-template-columns:minmax(0,392px) minmax(0,340px);justify-content:center;gap:40px;
  padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.phone{width:100%;height:790px;background:var(--surface);border-radius:44px;border:10px solid #1B1320;box-shadow:var(--shadow);
  display:flex;flex-direction:column;overflow:hidden;position:relative}
.p-status{display:flex;justify-content:space-between;padding:10px 22px 4px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.p-head{padding:6px 18px 12px;display:flex;align-items:center;gap:10px}
.p-head h2{font-size:19px;flex:1}
.back{border:1px solid var(--line);background:var(--surface);width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.p-body{flex:1;overflow-y:auto;padding:4px 16px 18px;display:flex;flex-direction:column;gap:14px;min-height:0}
.p-body>*{flex-shrink:0}
.p-nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface);padding:6px 4px 12px}
.p-nav.two{grid-template-columns:repeat(2,1fr)}
.p-nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0}
.p-nav button[aria-current="true"]{color:var(--brand)}
.p-nav svg{width:22px;height:22px}

.notes{align-self:start;position:sticky;top:90px;display:flex;flex-direction:column;gap:14px}
.notes .eyebrow{font-size:12px;letter-spacing:.04em;color:var(--muted);font-weight:600}
.notes h3{font-size:22px}
.notes ul{margin:0;padding-inline-start:18px;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.reqs{display:flex;flex-wrap:wrap;gap:6px}
.req{font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:6px;padding:2px 8px;background:var(--surface);font-variant-numeric:tabular-nums}
.req.star{border-color:var(--sun);background:var(--sun-soft)}
.flow{border-top:1px solid var(--line);padding-top:12px;font-size:13px;color:var(--muted)}
.flow ol{margin:6px 0 0;padding-inline-start:18px}

/* generic bits */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.card.soft{background:var(--surface-2)}
.hero-card{border-radius:12px;padding:16px;background:linear-gradient(150deg,var(--brand),var(--brand-2));color:var(--on-brand);display:flex;flex-direction:column;gap:8px}
.hero-card .muted{color:inherit;opacity:.8}
.btn{border:0;border-radius:8px;padding:12px 16px;font-weight:700;background:var(--brand);color:var(--on-brand);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.block{width:100%}
.btn.sun{background:var(--sun);color:var(--on-sun)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:8px}
.btn.ok{background:var(--ok);color:var(--on-brand)}
.btn.bad{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:11px 12px}
textarea.input{min-height:84px;resize:vertical}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--brand-soft);color:var(--brand)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.live .dot{animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.live .dot{animation:none}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;font-weight:600;text-align:center}
.tile svg{width:24px;height:24px;color:var(--brand)}
.list{display:flex;flex-direction:column;gap:8px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;text-align:start;display:flex;flex-direction:column;gap:4px;width:100%}
.opt[aria-pressed="true"]{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand);background:var(--brand-soft)}
.seats{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.seats i{display:block;height:100%;background:var(--brand)}
.seats.full i{background:var(--bad)}
.stops{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.stops li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:8px 0;position:relative}
.stops li::before{content:"";position:absolute;inset-inline-start:10px;top:0;bottom:0;width:2px;background:var(--line)}
.stops li:first-child::before{top:50%} .stops li:last-child::before{bottom:50%}
.stops .pin{width:14px;height:14px;border-radius:50%;border:3px solid var(--brand);background:var(--surface);z-index:1;margin-inline-start:4px}
.stops li.sel .pin{background:var(--coral);border-color:var(--coral)}
.stops li.off{opacity:.5;text-decoration:line-through}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface-2);padding:4px;border-radius:12px;border:1px solid var(--line)}
.seg button{border:0;background:transparent;padding:9px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.copy{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px dashed var(--line);border-radius:10px;padding:8px 10px;font-weight:600}
.drop{border:1.5px dashed var(--line);border-radius:14px;padding:16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer}
.drop img{max-height:140px;border-radius:10px}
.drop input{display:none}
.banner{border-radius:14px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.banner.warn{background:var(--warn-soft);color:var(--ink)}
.banner.info{background:var(--brand-soft)}
.banner.ok{background:var(--ok-soft)}
.countdown{font-family:var(--f-display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;direction:ltr}

/* digital card */
.idcard{border-radius:20px;padding:18px;color:#fff;background:
  radial-gradient(120% 90% at 100% 0%,rgba(207,100,75,.4),transparent 55%),radial-gradient(90% 80% at 0% 100%,rgba(37,121,136,.45),transparent 60%),linear-gradient(150deg,#58286E,#2F103D);
  position:relative;overflow:hidden;display:flex;flex-direction:column;gap:12px}
.idcard::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 2px,transparent 2px 9px);pointer-events:none}
.idcard .avatar{width:58px;height:58px;border-radius:14px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-family:var(--f-display);font-size:22px}
.idcard .holo{position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.22) 45%,transparent 60%);background-size:250% 100%;animation:holo 3.5s linear infinite;pointer-events:none}
@keyframes holo{from{background-position:120% 0}to{background-position:-120% 0}}
@media (prefers-reduced-motion:reduce){.idcard .holo{animation:none}}
.qrbox{background:#fff;border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;color:#141416}
.qrbox canvas{width:180px;height:180px;image-rendering:pixelated}

/* map */
.map{border-radius:20px;overflow:hidden;border:1px solid var(--line);background:var(--land)}
.map svg{display:block;width:100%;height:auto}
.map text{font-family:var(--f-body);font-size:10px;fill:var(--muted)}
.eta{display:flex;align-items:baseline;gap:6px}
.eta b{font-family:var(--f-display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}

/* chat */
.chat{display:flex;flex-direction:column;gap:8px}
.msg{max-width:85%;padding:9px 12px;border-radius:16px;font-size:14px;white-space:pre-line}
.msg.bot{background:var(--surface-2);border:1px solid var(--line);align-self:flex-start;border-start-start-radius:4px}
.msg.me{background:var(--brand);color:var(--on-brand);align-self:flex-end;border-start-end-radius:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600}
.composer{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--surface)}
.composer .input{border-radius:999px}
.typing{display:inline-flex;gap:3px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:pulse 1s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}

/* admin */
.admin{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 60px)}
.side{background:var(--surface);border-inline-end:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:2px}
.side .grp{font-size:11.5px;font-weight:600;color:var(--muted);padding:12px 12px 4px;letter-spacing:.03em}
.side button{border:0;background:none;text-align:start;padding:9px 12px;border-radius:10px;font-weight:600;display:flex;align-items:center;gap:10px;color:var(--ink)}
.side button svg{width:18px;height:18px;color:var(--muted)}
.side button[aria-current="true"]{background:var(--brand-soft);color:var(--brand)}
.side button[aria-current="true"] svg{color:var(--brand)}
.side .badge{margin-inline-start:auto;background:var(--bad);color:var(--on-brand);font-size:11px;border-radius:999px;padding:0 7px;font-variant-numeric:tabular-nums}
.main{padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;min-width:0}
.main-inner{max-width:1180px;width:100%;margin-inline:auto;display:flex;flex-direction:column;gap:18px}
.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.ph h2{font-size:24px}
.ph .sp{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--f-display);font-weight:800;font-size:28px;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--muted)}
.cols{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h3{font-size:16px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
.tbl th{background:var(--surface-2);text-align:start;font-weight:600;color:var(--muted);font-size:12.5px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.num{font-variant-numeric:tabular-nums}
.bar{display:grid;grid-template-columns:150px 1fr 64px;gap:10px;align-items:center;font-size:13px}
.bar .track{height:10px;background:var(--surface-2);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.bar .track i{display:block;height:100%;background:var(--brand);border-radius:6px}
.bar .track i.hot{background:var(--sun)}
.chain{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:12px}
.chain span{padding:2px 8px;border-radius:6px;border:1px solid var(--line);font-weight:600}
.chain span.done{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chain span.now{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chain span.rej{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.thumb{width:56px;height:42px;border-radius:8px;object-fit:cover;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-size:10px;color:var(--muted)}
.linecards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.feed{display:flex;flex-direction:column;gap:10px;font-size:13.5px}
.feed div{display:flex;gap:10px} .feed time{color:var(--muted);font-variant-numeric:tabular-nums;min-width:44px}
.modal-bg{position:fixed;inset:0;background:rgba(20,17,23,.55);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:20px;padding:20px;width:min(460px,100%);display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);max-height:90vh;overflow:auto}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline-start:50%;transform:translateX(50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:600;z-index:60;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.export-prev{font-size:12.5px}

@media (max-width:900px){
  .stage{grid-template-columns:minmax(0,420px)}
  .notes{position:static}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cols{grid-template-columns:minmax(0,1fr)}
  .admin{grid-template-columns:minmax(0,1fr)}
  .side{flex-direction:row;overflow-x:auto;border-inline-end:0;border-bottom:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
  .side .grp{display:none}
  .side button{white-space:nowrap;flex:none}
}
@media (max-width:520px){
  .stage{padding-left:0;padding-right:0;padding-block:0 24px;gap:20px}
  .phone{border:0;border-radius:0;height:calc(100vh - 110px);min-height:600px;box-shadow:none}
  .p-status{display:none}
  .notes{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .bar{grid-template-columns:100px 1fr 54px}
  .roles{margin-inline-start:0;width:100%}
  .roles button{flex:1;padding:7px 8px}
}
</style>
</head>
<body>
<style>
.err{color:var(--bad);font-size:13px;font-weight:600}
.hint{font-size:12.5px;color:var(--muted)}
.icon-btn{position:relative;border:1px solid var(--line);background:var(--surface);width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
.icon-btn .cnt{position:absolute;top:-6px;inset-inline-end:-6px;background:var(--bad);color:var(--on-brand);font-size:10.5px;font-weight:700;border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px;font-variant-numeric:tabular-nums}
.notif{display:flex;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.notif.unread{border-color:var(--brand);background:var(--brand-soft)}
.notif time{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

 const rem=frac-S.busT[id],dl=S.delays[id]?S.delays[id].mins:0; return (rem<=0?Math.max(1,Math.round((1-S.busT[id])*35)):Math.max(1,Math.round(rem*45)))+dl;
}

ithout review","كل عملية فيها فلوس أو إلغاء أو قرار بتتسجل: مين عملها وامتى. السجل ما بيتمسحش.":"Every action involving money, a cancellation or a decision is logged: who did it and when. The log can't be deleted.","PWA: لينك واحد يشتغل على أندرويد وآيفون والكمبيوتر ويتثبت على الشاشة الرئيسية":"PWA: one link that works on Android, iPhone and desktop and installs on the home screen","اشتراك واحد بس للطالب: لو مشترك أو حاجز، الاختيار بيتقفل ويحوله لطلب تغيير خط":"One subscription per student: if subscribed or booked, selection is locked and redirected to a line-change request","صدّر كشوف الطلاب بالخط أو النقطة، وابعت التقارير للمالية والأمن والأمين العام":"Export student lists by line or stop, and send reports to Finance, Security and the Secretary General","الطلب بيعدي على ولي الأمر ثم إدارة النقل ثم المالية. تقدر تقدمه من «طلباتي».":"The request goes to the parent, then the transport office, then Finance. You can submit it from \"My requests\".","أسعار الترم الأول 2026/2027 للاشتراكات الجديدة. الخط المكتمل بيتقفل تلقائي.":"First-term 2026/2027 prices for new subscriptions. A full line closes automatically.","أول ما تبدأ الرحلة موقعك هيظهر للطلاب ولإدارة النقل، وتقدر تمسح الكارنيهات.":"Once you start the trip, your location shows to students and the transport office, and you can scan cards.","استرداد، تغيير خط، أو دخول مجسم مشروع، وكلهم بيمشوا في سلسلة موافقات واحدة.":"Refunds, line changes, or bringing a project model on board, all going through one approval chain.","النسخة الفعلية: نموذج ذكاء اصطناعي مربوط بسياسات النقل وبيانات الطالب (RAG)":"Real version: an AI model connected to transport policies and student data (RAG)","تقدر تشوفه على الخريطة من «التتبع»، وهيوصلك إشعار لما يبقى على بعد 5 دقايق.":"You can see it on the map under \"Tracking\", and you'll be notified when it's 5 minutes away.","صلاحية محدودة: الشركة بتشوف باصاتها وطلبات التشغيل بس، من غير بيانات الطلاب":"Limited access: the company sees only its buses and service requests, no student data","في التغيير الدائم: لو الخط الجديد أغلى هتدفع الفرق، ولو أرخص الفرق بيرجعلك.":"For a permanent change: if the new line costs more you pay the difference; if cheaper, the difference is refunded.","أي تأخير أو تغيير باص على خطه بيظهر فوق، والوقت المتوقع بيتحسب فيه التأخير":"Any delay or bus change on their line shows at the top, and the ETA includes the delay","اعرض الكود على المشرف عند الركوب. صورة الشاشة مش هتشتغل لأن الكود بيتغير.":"Show the code to the supervisor when boarding. A screenshot won't work because the code changes.","الكرسي هيرجع متاح لغيرك، ولو عايز تشترك تاني هتحجز من الأول بالسعر وقتها.":"The seat will be released to others; to subscribe again you'll book from scratch at the price then.","كل الطلبات في مكان واحد بسلسلة موافقات: ولي الأمر ← إدارة النقل ← المالية":"All requests in one place with an approval chain: Parent → Transport office → Finance","إيصالات InstaPay والتحويل البنكي للمراجعة، ومدفوعات فوري المؤكدة تلقائي":"InstaPay and bank-transfer receipts for review, plus auto-confirmed Fawry payments","الموافقات: ولي الأمر ← إدارة النقل ← المالية. لما يكمل الكارنيه هيتقفل.":"Approvals: Parent → Transport office → Finance. Once complete, the card will be locked.","انقل طالب لخط تاني بشكل دائم أو مؤقت أو ليوم واحد، أو الغي اشتراك مخالف":"Move a student to another line permanently, temporarily or for one day, or cancel a violating subscription","مفيش إشعارات لسه. أي قرار من المالية أو الإدارة أو ولي الأمر هيظهر هنا.":"No notifications yet. Any decision from Finance, the office or your parent will show here.","كارنيه على الموبايل فيه QR بيتغير كل 30 ثانية، فصورة الشاشة ما تنفعش.":"A phone card with a QR that changes every 30 seconds, so screenshots don't work.","السائق أو المشرف يسجل مخالفة فورًا بصورة، وتوصل لإدارة النقل والأمن.":"The driver or supervisor logs a violation instantly with a photo; it goes to the transport office and Security.","مينفعش تقدم طلب جديد لحد ما الطلب ده يخلص، عشان القرارات ما تتعارضش.":"You can't submit a new request until this on
